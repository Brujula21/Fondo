<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cambiar Fondo</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: white; /* color inicial */
    }
    h1 {
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <h1>Modifica el color de fondo</h1>
  
  <input type="color" id="selectorColor">
  <button onclick="cambiarFondo()">Aplicar color</button>
  
  <script>
    function cambiarFondo() {
      const color = document.getElementById("selectorColor").value;
      document.body.style.backgroundColor = color;
    }
  </script>
</body>
</html>
